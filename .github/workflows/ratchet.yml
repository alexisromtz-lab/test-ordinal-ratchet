name: ordinal-ratchet

on: [push, pull_request]

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install .
      - run: python -m unittest discover -s tests -q
      - run: test-ordinal-ratchet tests
      - run: test-ordinal-ratchet --version
