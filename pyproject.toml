[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-ordinal-ratchet"
version = "0.2.4"
description = "Detect test names that overwrite each other or reuse an ordinal, with a one-way ratchet over inherited debt"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["testing", "lint", "merge", "pytest", "unittest", "static-analysis", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/test-ordinal-ratchet"
Repository = "https://github.com/alexisromtz-lab/test-ordinal-ratchet"
Issues = "https://github.com/alexisromtz-lab/test-ordinal-ratchet/issues"
Releases = "https://github.com/alexisromtz-lab/test-ordinal-ratchet/releases"
Changelog = "https://github.com/alexisromtz-lab/test-ordinal-ratchet/releases"

[project.scripts]
test-ordinal-ratchet = "ordinal_ratchet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["ordinal_ratchet"]
