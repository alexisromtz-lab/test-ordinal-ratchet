[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-ordinal-ratchet"
version = "0.1.0"
description = "Detecta nombres de prueba pisados o con ordinal repetido, con trinquete de deuda heredada"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["testing", "lint", "merge", "pytest", "unittest", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
test-ordinal-ratchet = "ordinal_ratchet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["ordinal_ratchet"]
